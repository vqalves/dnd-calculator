<html>
    <head>
        <style>
            table {
                border-collapse: collapse;
                margin: 10px 0;
            }
            th, td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
            }
            th {
                background-color: #f0f0f0;
                font-weight: bold;
            }
            input[type="text"], input[type="number"] {
                width: 100%;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>You bonus attack</td>
                <td><input type="text" value="8" id="attack-bonus" /></td>
            </tr>
            <tr>
                <td>Spell</td>
                <td>
                    <input type="checkbox" value="magic-missile">Magic missile</option>
                    <input type="checkbox" value="scorching-ray">Scorching Ray</option>
                    <input type="checkbox" value="spellfire-flare">Spellfire Flare</option>
                </td>
            </tr>
            <tr>
                <td>Spell level</td>
                <td>
                    <select id="spell-level">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Advantage</td>
                <td><input type="checkbox" id="advantage" /></td>
            </tr>
            <tr>
                <td>Critical hit threshold</td>
                <td><input type="number" value="20" min="1" max="20" id="crit-threshold" /></td>
            </tr>
            <tr>
                <td>Additional damage when critical</td>
                <td><input type="number" value="0" id="crit-damage-type" /></td>
            </tr>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Enemy</th>
                    <th>Enemy AC</th>
                    <th>Spell</th>

                    <!-- Amount of attacks based on spells selected and spell level -->
                    <th>Attacks executed</th>

                    <!-- Chance to hit the target individually -->
                    <th>%Chance of hitting per attack</th>

                    <!-- Consider chance to hit the target -->
                    <th>Average damage</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="enemies-tbody">
                <tr>
                    <td><input type="text" value="Enemy 1" class="enemy-name" /></td>
                    <td><input type="number" value="16" class="enemy-ac" /></td>
                    
                    <!-- TODO: Every spell selected must display a result row for the enemy -->
                    <td class="spell-name">-</td>
                    <td class="attacks-executed">-</td>
                    <td class="prob-hitting">-</td>
                    <td class="avg-damage">-</td>
                    <td><button class="remove-enemy">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <button id="add-enemy">Add enemy</button>
        <button id="calculate">Calculate</button>
    </body>

    <script type="text/javascript">
        (function() {
            const defaultProbabilityToHit = function({enemyAc, attackBonus, advantage}) {
                // Calculate minimum roll needed on the d20
                const minRollNeeded = enemyAc - attackBonus;

                // Auto-hit if we can't fail, auto-miss if we can't succeed
                if (minRollNeeded <= 1) return 1.0;
                if (minRollNeeded > 20) return 0.0;

                const diceAmount = advantage ? 2 : 1;
                return probabilityOfAtLeast({diceAmount: diceAmount, diceSize: 20, expectedNumber: minRollNeeded});
            }

            var spells = [
                {
                    "name": "Magic Missile",
                    "minimumSpellLevel": 1,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel + 3;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 3.5;
                    },
                    "probabilityToHit": function({enemyAc, attackBonus, advantage}) {
                        return 1.0;
                    }
                },
                {
                    "name": "Scorching Ray",
                    "minimumSpellLevel": 2,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel+1;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 7;
                    },
                    "probabilityToHit": defaultProbabilityToHit
                },
                {
                    "name": "Spellfire Flare",
                    "minimumSpellLevel": 1,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 11;
                    },
                    "probabilityToHit": defaultProbabilityToHit
                }
            ];

            // TODO: Reelabore calculations and formulas below from here
            let enemyCounter = 1;

            // Add enemy functionality
            const addEnemy = function() {
                enemyCounter++;
                const tbody = document.getElementById('enemies-tbody');
                const newRow = document.createElement('tr');

                newRow.innerHTML = `
                    <td><input type="text" value="Enemy ${enemyCounter}" class="enemy-name" /></td>
                    <td><input type="number" value="16" class="enemy-ac" /></td>
                    <td class="prob-rolling">-</td>
                    <td class="prob-hitting">-</td>
                    <td class="prob-hitting-jumping">-</td>
                    <td class="avg-damage">-</td>
                    <td><button class="remove-enemy">Remove</button></td>
                `;

                tbody.appendChild(newRow);
                attachRemoveHandler(newRow.querySelector('.remove-enemy'));
            };

            // Remove enemy functionality
            const removeEnemy = function(button) {
                const row = button.closest('tr');
                const tbody = document.getElementById('enemies-tbody');

                // Prevent removing the last enemy
                if (tbody.children.length > 1) {
                    row.remove();
                } else {
                    alert('You must have at least one enemy.');
                }
            };

            // Attach remove handler to a button
            const attachRemoveHandler = function(button) {
                button.addEventListener('click', function() {
                    removeEnemy(this);
                });
            };

            const averageResultOfDice = function({diceAmount, diceSize}) {
                const perDice = (diceSize + 1) / 2.0;
                return perDice * diceAmount;
            }

            const averageDamageToEnemy = function({hitChange, diceAmount, diceSize}) {
                return averageResultOfDice({diceAmount: diceAmount, diceSize: diceSize}) * hitChange;
            }

            const maximumAttacks = function({chromaticOrbSpellLevel}) {
                return chromaticOrbSpellLevel + 1;
            }

            const numberOfDamageDices = function({chromaticOrbSpellLevel}) {
                return chromaticOrbSpellLevel + 2;
            }

            const probabilityOfDuplicatedDices = function({diceAmount, diceSize}) {
                // Calculate probability of at least 2 dice matching using complement
                // Easier to calculate: 1 - P(all dice are different)
                if (diceAmount === 1) return 0;
                if (diceAmount > diceSize) return 1; // Pigeonhole principle

                let probAllDifferent = 1;
                for (let i = 0; i < diceAmount; i++) {
                    probAllDifferent *= (diceSize - i) / diceSize;
                }
                return 1 - probAllDifferent;
            }

            const probabilityOfAtLeast = function({diceAmount, diceSize, expectedNumber}) {
                // Probability of a single die NOT rolling expectedNumber or higher
                const probSingleFail = (expectedNumber - 1) / diceSize;
                // Probability of ALL dice failing
                const probAllFail = Math.pow(probSingleFail, diceAmount);
                // Probability of at least one success
                return 1 - probAllFail;
            }

            const probabilityToHit = function({enemyAc, attackBonus, advantage}) {
                // Calculate minimum roll needed on the d20
                const minRollNeeded = enemyAc - attackBonus;

                // Auto-hit if we can't fail, auto-miss if we can't succeed
                if (minRollNeeded <= 1) return 1.0;
                if (minRollNeeded > 20) return 0.0;

                const diceAmount = advantage ? 2 : 1;
                return probabilityOfAtLeast({diceAmount: diceAmount, diceSize: 20, expectedNumber: minRollNeeded});
            }

            const probabilityToMiss = function({enemyAc, attackBonus, advantage}) {
                return 1 - probabilityToHit({
                    enemyAc: enemyAc, 
                    attackBonus: attackBonus, 
                    advantage: advantage});
            }

            const probabilityToCrit = function({advantage, critThreshold}) {
                const diceAmount = advantage ? 2 : 1;
                return probabilityOfAtLeast({diceAmount: diceAmount, diceSize: 20, expectedNumber: critThreshold});
            }

            const calculate = function() {
                // Retrieve global field values
                const attackBonus = parseInt(document.getElementById('attack-bonus').value);
                const spellLevel = parseInt(document.getElementById('spell-level').value);
                const advantage = document.getElementById('advantage').checked;
                const critThreshold = parseInt(document.getElementById('crit-threshold').value);

                // Get all enemy rows
                const tbody = document.getElementById('enemies-tbody');
                const enemyRows = Array.from(tbody.children);
                const numEnemies = enemyRows.length;

                // Calculate constants
                const maxAttacks = maximumAttacks({chromaticOrbSpellLevel: spellLevel});
                const numDice = numberOfDamageDices({chromaticOrbSpellLevel: spellLevel});
                const diceSize = 8; // Chromatic Orb deals d8 damage
                const jumpChance = probabilityOfDuplicatedDices({diceAmount: numDice, diceSize: diceSize});

                // Calculate crit damage
                const critChance = probabilityToCrit({advantage: advantage, critThreshold: critThreshold});
                const baseDamagePerHit = averageResultOfDice({diceAmount: numDice, diceSize: diceSize});
                const additionalCritDamage = parseFloat(document.getElementById('crit-damage-type').value) || 0;
                const avgDamagePerHit = baseDamagePerHit + (critChance * additionalCritDamage);

                // Calculate results for each enemy
                let totalWeightedDamage = 0;
                let probReachingLoop = 1.0;

                for (let i = 0; i < enemyRows.length; i++) {
                    const row = enemyRows[i];
                    const loopNumber = i + 1;

                    // Get enemy AC
                    const enemyAc = parseInt(row.querySelector('.enemy-ac').value);

                    if (loopNumber <= maxAttacks) {
                        // Calculate hit probability for this specific enemy
                        const hitChance = probabilityToHit({enemyAc: enemyAc, attackBonus: attackBonus, advantage: advantage});

                        // Probability of reaching this loop (1 for first loop)
                        const probRollingAttack = probReachingLoop;

                        // Prob of hitting + jumping = prob reaching loop × prob hitting this enemy
                        const probHittingAndJumping = probReachingLoop * hitChance * jumpChance;

                        // Average damage = (prob reaching loop) × (prob hitting) × (avg damage per hit)
                        const avgDamage = probReachingLoop * hitChance * avgDamagePerHit;

                        // Update total weighted damage
                        totalWeightedDamage += avgDamage;

                        // Update probability for next loop
                        if (i < enemyRows.length - 1) {
                            probReachingLoop = probHittingAndJumping;
                        }

                        // Populate table cells
                        row.querySelector('.prob-rolling').textContent = (probRollingAttack * 100).toFixed(2) + '%';
                        row.querySelector('.prob-hitting').textContent = (hitChance * 100).toFixed(2) + '%';
                        row.querySelector('.prob-hitting-jumping').textContent = (probHittingAndJumping * 100).toFixed(2) + '%';
                        row.querySelector('.avg-damage').textContent = avgDamage.toFixed(2);
                    } else {
                        // No loop available for this enemy
                        row.querySelector('.prob-rolling').textContent = '0.00%';
                        row.querySelector('.prob-hitting').textContent = '0.00%';
                        row.querySelector('.prob-hitting-jumping').textContent = '0.00%';
                        row.querySelector('.avg-damage').textContent = '0.00';
                    }
                }

                // Show summary section
                const summarySection = document.getElementById('summary-section');
                summarySection.style.display = 'block';

                // Update overall damage
                const overallDamage = document.getElementById('overall-damage');
                overallDamage.textContent = 'Overall Expected Damage: ' + totalWeightedDamage.toFixed(2);

                // Update warning if applicable
                const loopWarning = document.getElementById('loop-warning');
                if (numEnemies < maxAttacks) {
                    loopWarning.textContent = `Warning: You have ${numEnemies} enemy(ies) but ${maxAttacks} loops available. Not all loops are being used.`;
                } else {
                    loopWarning.textContent = '';
                }
            }

            // Bind buttons
            document.getElementById('calculate').addEventListener('click', calculate);
            document.getElementById('add-enemy').addEventListener('click', addEnemy);

            // Attach remove handlers to existing buttons
            document.querySelectorAll('.remove-enemy').forEach(function(button) {
                attachRemoveHandler(button);
            });
        })();
    </script>
</html>
