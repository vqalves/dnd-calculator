<html>
    <head>
        <style>
            table {
                border-collapse: collapse;
                margin: 10px 0;
            }
            th, td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
            }
            th {
                background-color: #f0f0f0;
                font-weight: bold;
            }
            input[type="text"], input[type="number"] {
                width: 100%;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>You bonus attack</td>
                <td><input type="text" value="8" id="attack-bonus" /></td>
            </tr>
            <tr>
                <td>Advantage</td>
                <td><input type="checkbox" id="advantage" /></td>
            </tr>
        </table>

        <h3>Spells</h3>
        <table>
            <thead>
                <tr>
                    <th>Spell</th>
                    <th>Level</th>
                    <th>Crit Threshold</th>
                    <th>Additional Crit Damage</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><label><input type="checkbox" value="magic-missile" class="spell-checkbox"> Magic Missile (1d4+1 per missile)</label></td>
                    <td class="spell-level-display" data-spell="magic-missile">
                        <select class="spell-level-select" data-spell="magic-missile">
                            <option value="1">1 (avg 10.5)</option>
                            <option value="2">2 (avg 14)</option>
                            <option value="3">3 (avg 17.5)</option>
                            <option value="4">4 (avg 21)</option>
                            <option value="5">5 (avg 24.5)</option>
                            <option value="6">6 (avg 28)</option>
                            <option value="7">7 (avg 31.5)</option>
                            <option value="8">8 (avg 35)</option>
                            <option value="9">9 (avg 38.5)</option>
                        </select>
                        <span class="avg-damage-display"></span>
                    </td>
                    <td><input type="number" value="20" min="1" max="20" class="spell-crit-threshold" data-spell="magic-missile" /></td>
                    <td><input type="number" value="0" class="spell-crit-damage" data-spell="magic-missile" /></td>
                </tr>
                <tr>
                    <td><label><input type="checkbox" value="scorching-ray" class="spell-checkbox"> Scorching Ray (2d6 per missile)</label></td>
                    <td class="spell-level-display" data-spell="scorching-ray">
                        <select class="spell-level-select" data-spell="scorching-ray">
                            <option value="2" selected>2 (avg 21)</option>
                            <option value="3">3 (avg 28)</option>
                            <option value="4">4 (avg 35)</option>
                            <option value="5">5 (avg 42)</option>
                            <option value="6">6 (avg 49)</option>
                            <option value="7">7 (avg 56)</option>
                            <option value="8">8 (avg 63)</option>
                            <option value="9">9 (avg 70)</option>
                        </select>
                        <span class="avg-damage-display"></span>
                    </td>
                    <td><input type="number" value="20" min="1" max="20" class="spell-crit-threshold" data-spell="scorching-ray" /></td>
                    <td><input type="number" value="0" class="spell-crit-damage" data-spell="scorching-ray" /></td>
                </tr>
                <tr>
                    <td><label><input type="checkbox" value="spellfire-flare" class="spell-checkbox"> Spellfire Flare (2d10 per missile)</label></td>
                    <td class="spell-level-display" data-spell="spellfire-flare">
                        <select class="spell-level-select" data-spell="spellfire-flare">
                            <option value="1">1 (avg 11)</option>
                            <option value="2">2 (avg 22)</option>
                            <option value="3">3 (avg 33)</option>
                            <option value="4">4 (avg 44)</option>
                            <option value="5">5 (avg 55)</option>
                            <option value="6">6 (avg 66)</option>
                            <option value="7">7 (avg 77)</option>
                            <option value="8">8 (avg 88)</option>
                            <option value="9">9 (avg 99)</option>
                        </select>
                        <span class="avg-damage-display"></span>
                    </td>
                    <td><input type="number" value="20" min="1" max="20" class="spell-crit-threshold" data-spell="spellfire-flare" /></td>
                    <td><input type="number" value="0" class="spell-crit-damage" data-spell="spellfire-flare" /></td>
                </tr>
            </tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Enemy</th>
                    <th>Enemy AC</th>
                    <th>Spell</th>

                    <!-- Amount of attacks based on spells selected and spell level -->
                    <th>Attacks executed</th>

                    <!-- Chance to hit the target individually -->
                    <th>%Chance of hitting per attack</th>

                    <!-- Consider chance to hit the target -->
                    <th>Average damage</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="enemies-tbody">
                <tr>
                    <td><input type="text" value="Enemy 1" class="enemy-name" /></td>
                    <td><input type="number" value="16" class="enemy-ac" /></td>
                    <td class="spell-name">-</td>
                    <td class="attacks-executed">-</td>
                    <td class="prob-hitting">-</td>
                    <td class="avg-damage">-</td>
                    <td><button class="remove-enemy">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <button id="add-enemy">Add enemy</button>
        <button id="calculate">Calculate</button>
    </body>

    <script type="text/javascript">
        (function() {
            const defaultProbabilityToHit = function({enemyAc, attackBonus, advantage}) {
                // Calculate minimum roll needed on the d20
                const minRollNeeded = enemyAc - attackBonus;

                // Auto-hit if we can't fail, auto-miss if we can't succeed
                if (minRollNeeded <= 1) return 1.0;
                if (minRollNeeded > 20) return 0.0;

                const diceAmount = advantage ? 2 : 1;
                return probabilityOfAtLeast({diceAmount: diceAmount, diceSize: 20, expectedNumber: minRollNeeded});
            }

            const defaultProbabilityToCrit = function({advantage, critThreshold}) {
                const diceAmount = advantage ? 2 : 1;
                return probabilityOfAtLeast({diceAmount: diceAmount, diceSize: 20, expectedNumber: critThreshold});
            };

            var spells = [
                {
                    "name": "Magic Missile",
                    "value": "magic-missile",
                    "minimumSpellLevel": 1,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel + 2;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 3.5;
                    },
                    "probabilityToHit": function({enemyAc, attackBonus, advantage}) {
                        return 1.0;
                    },
                    "probabilityToCrit": function({advantage, critThreshold}) {
                        return 0.0;
                    }
                },
                {
                    "name": "Scorching Ray",
                    "value": "scorching-ray",
                    "minimumSpellLevel": 2,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel+1;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 7;
                    },
                    "probabilityToHit": defaultProbabilityToHit,
                    "probabilityToCrit": defaultProbabilityToCrit
                },
                {
                    "name": "Spellfire Flare",
                    "value": "spellfire-flare",
                    "minimumSpellLevel": 1,
                    "getAttackCount": function({spellLevel}) {
                        return spellLevel;
                    },
                    "getAttackDamage": function({spellLevel}) {
                        return 11;
                    },
                    "probabilityToHit": defaultProbabilityToHit,
                    "probabilityToCrit": defaultProbabilityToCrit
                }
            ];

            let enemyCounter = 1;

            // Add enemy functionality
            const addEnemy = function() {
                enemyCounter++;
                const tbody = document.getElementById('enemies-tbody');
                const newRow = document.createElement('tr');

                newRow.innerHTML = `
                    <td><input type="text" value="Enemy ${enemyCounter}" class="enemy-name" /></td>
                    <td><input type="number" value="16" class="enemy-ac" /></td>
                    <td class="spell-name">-</td>
                    <td class="attacks-executed">-</td>
                    <td class="prob-hitting">-</td>
                    <td class="avg-damage">-</td>
                    <td><button class="remove-enemy">Remove</button></td>
                `;

                tbody.appendChild(newRow);
                attachRemoveHandler(newRow.querySelector('.remove-enemy'));
            };

            // Remove enemy functionality
            const removeEnemy = function(button) {
                const row = button.closest('tr');
                const tbody = document.getElementById('enemies-tbody');

                // Prevent removing the last enemy
                if (tbody.children.length > 1) {
                    row.remove();
                } else {
                    alert('You must have at least one enemy.');
                }
            };

            // Attach remove handler to a button
            const attachRemoveHandler = function(button) {
                button.addEventListener('click', function() {
                    removeEnemy(this);
                });
            };


            const probabilityOfAtLeast = function({diceAmount, diceSize, expectedNumber}) {
                // Probability of a single die NOT rolling expectedNumber or higher
                const probSingleFail = (expectedNumber - 1) / diceSize;
                // Probability of ALL dice failing
                const probAllFail = Math.pow(probSingleFail, diceAmount);
                // Probability of at least one success
                return 1 - probAllFail;
            }


            const calculate = function() {
                // Retrieve global field values
                const attackBonus = parseInt(document.getElementById('attack-bonus').value);
                const advantage = document.getElementById('advantage').checked;

                // Get selected spells with their individual settings
                const selectedSpellCheckboxes = document.querySelectorAll('.spell-checkbox:checked');
                const selectedSpells = Array.from(selectedSpellCheckboxes).map(checkbox => {
                    const spell = spells.find(spell => spell.value === checkbox.value);
                    if (spell) {
                        // Get per-spell settings
                        const spellLevelSelect = document.querySelector(`.spell-level-select[data-spell="${spell.value}"]`);
                        const critThresholdInput = document.querySelector(`.spell-crit-threshold[data-spell="${spell.value}"]`);
                        const critDamageInput = document.querySelector(`.spell-crit-damage[data-spell="${spell.value}"]`);

                        const spellLevel = parseInt(spellLevelSelect.value);
                        const attackCount = spell.getAttackCount({spellLevel: spellLevel});
                        const damagePerAttack = spell.getAttackDamage({spellLevel: spellLevel});
                        const avgDamage = attackCount * damagePerAttack;

                        // Update the display format in the spell table
                        const displaySpan = document.querySelector(`.spell-level-display[data-spell="${spell.value}"] .avg-damage-display`);
                        displaySpan.textContent = ` (avg ${avgDamage.toFixed(2)})`;

                        return {
                            ...spell,
                            spellLevel: spellLevel,
                            critThreshold: parseInt(critThresholdInput.value) || 20,
                            additionalCritDamage: parseFloat(critDamageInput.value) || 0
                        };
                    }
                    return null;
                }).filter(spell => spell !== null);

                // Get all enemy input rows (the rows with inputs)
                const tbody = document.getElementById('enemies-tbody');
                const enemyInputRows = Array.from(tbody.querySelectorAll('tr')).filter(row => {
                    return row.querySelector('.enemy-name') !== null;
                });

                // Clear all existing rows in tbody
                tbody.innerHTML = '';

                // If no spells selected, show placeholder
                if (selectedSpells.length === 0) {
                    enemyInputRows.forEach(inputData => {
                        const newRow = document.createElement('tr');
                        const enemyName = inputData.querySelector('.enemy-name').value;
                        const enemyAc = inputData.querySelector('.enemy-ac').value;

                        newRow.innerHTML = `
                            <td><input type="text" value="${enemyName}" class="enemy-name" /></td>
                            <td><input type="number" value="${enemyAc}" class="enemy-ac" /></td>
                            <td class="spell-name">-</td>
                            <td class="attacks-executed">-</td>
                            <td class="prob-hitting">-</td>
                            <td class="avg-damage">-</td>
                            <td><button class="remove-enemy">Remove</button></td>
                        `;
                        tbody.appendChild(newRow);
                        attachRemoveHandler(newRow.querySelector('.remove-enemy'));
                    });
                    return;
                }

                // For each enemy, create rows for each selected spell
                enemyInputRows.forEach((inputData, enemyIndex) => {
                    const enemyName = inputData.querySelector('.enemy-name').value;
                    const enemyAc = parseInt(inputData.querySelector('.enemy-ac').value);

                    selectedSpells.forEach((spell, spellIndex) => {
                        const newRow = document.createElement('tr');

                        // Check if spell can be cast at this level
                        if (spell.spellLevel < spell.minimumSpellLevel) {
                            // Show N/A for invalid spell level
                            newRow.innerHTML = `
                                <td>${spellIndex === 0 ? `<input type="text" value="${enemyName}" class="enemy-name" />` : ''}</td>
                                <td>${spellIndex === 0 ? `<input type="number" value="${enemyAc}" class="enemy-ac" />` : ''}</td>
                                <td class="spell-name">${spell.name}</td>
                                <td class="attacks-executed">N/A</td>
                                <td class="prob-hitting">N/A</td>
                                <td class="avg-damage">N/A</td>
                                <td>${spellIndex === 0 ? `<button class="remove-enemy">Remove</button>` : ''}</td>
                            `;
                        } else {
                            // Calculate for this spell
                            const attackCount = spell.getAttackCount({spellLevel: spell.spellLevel});
                            const damagePerAttack = spell.getAttackDamage({spellLevel: spell.spellLevel});
                            const hitChance = spell.probabilityToHit({enemyAc: enemyAc, attackBonus: attackBonus, advantage: advantage});
                            const critChance = spell.probabilityToCrit({advantage: advantage, critThreshold: spell.critThreshold});

                            // Total average damage = attacks × hit chance × (base damage + crit chance × additional crit damage)
                            const avgDamagePerAttack = damagePerAttack + (critChance * spell.additionalCritDamage);
                            const totalAvgDamage = attackCount * hitChance * avgDamagePerAttack;

                            newRow.innerHTML = `
                                <td>${spellIndex === 0 ? `<input type="text" value="${enemyName}" class="enemy-name" />` : ''}</td>
                                <td>${spellIndex === 0 ? `<input type="number" value="${enemyAc}" class="enemy-ac" />` : ''}</td>
                                <td class="spell-name">${spell.name}</td>
                                <td class="attacks-executed">${attackCount}</td>
                                <td class="prob-hitting">${(hitChance * 100).toFixed(2)}%</td>
                                <td class="avg-damage">${totalAvgDamage.toFixed(2)}</td>
                                <td>${spellIndex === 0 ? `<button class="remove-enemy">Remove</button>` : ''}</td>
                            `;
                        }

                        tbody.appendChild(newRow);

                        // Attach remove handler only for first spell row
                        if (spellIndex === 0) {
                            attachRemoveHandler(newRow.querySelector('.remove-enemy'));
                        }
                    });
                });
            }

            // Bind buttons
            document.getElementById('calculate').addEventListener('click', calculate);
            document.getElementById('add-enemy').addEventListener('click', addEnemy);

            // Attach remove handlers to existing buttons
            document.querySelectorAll('.remove-enemy').forEach(function(button) {
                attachRemoveHandler(button);
            });
        })();
    </script>
</html>
